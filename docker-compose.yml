# Продовый подъём сервера: postgres + api + nginx (HTTPS)
# Использование:  cp server/.env.example server/.env  (поменяйте JWT_SECRET и DATABASE_URL)
#                 docker compose -f deploy/docker-compose.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: polina
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: polinagram
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polina"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://polina:${DB_PASSWORD:-change-me}@db:5432/polinagram
      JWT_SECRET: ${JWT_SECRET:?Задайте JWT_SECRET в окружении или .env}
      DEV_RETURN_CODE: "false"
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro

volumes:
  pgdata:
