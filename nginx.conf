# nginx перед uvicorn: HTTPS + проброс WebSocket
# Замените api.example.com на ваш домен. Первый сертификат выпустите:
#   docker compose run --rm certbot  (см. deploy/docker-compose.yml — certbot опционален)
#   либо certbot на хосте и смонтируйте /etc/letsencrypt в ./certbot/conf

upstream polinagram_api {
    server api:8000;
}

server {
    listen 80;
    server_name api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://polinagram_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket: повышаем таймауты и пробрасываем заголовки Upgrade
    location /ws/ {
        proxy_pass http://polinagram_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
